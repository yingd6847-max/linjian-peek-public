name: Sync official 掌心窗

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync official repository
        shell: bash
        run: |
          git clone --depth 1 https://github.com/linzhi-524/linjian-peek-public.git /tmp/official
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/sync-upstream.yml' \
            /tmp/official/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Sync official 掌心窗 v0.3.7"
            git push origin HEAD:main
          fi
